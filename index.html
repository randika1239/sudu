<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sudu Manika ❤️</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { min-height: 100vh; overflow: hidden; font-family: Georgia, serif; color: white; text-align: center; background: radial-gradient(circle at 50% 35%, #74345f, #25152f 48%, #080711 100%); } /* Stars */ .stars { position: fixed; inset: 0; background-image: radial-gradient(2px 2px at 10% 20%, white, transparent), radial-gradient(2px 2px at 30% 70%, white, transparent), radial-gradient(1.5px 1.5px at 60% 15%, white, transparent), radial-gradient(2px 2px at 80% 35%, white, transparent), radial-gradient(2px 2px at 90% 80%, white, transparent), radial-gradient(2px 2px at 45% 50%, white, transparent); opacity: .8; } /* Moon */ .moon { position: fixed; top: 7%; right: 9%; width: 90px; height: 90px; border-radius: 50%; background: #fff1cf; box-shadow: 0 0 35px #fff1cf, 0 0 80px #ffb5d5; } /* Castle */ .castle { position: fixed; bottom: 0; width: 100%; height: 30%; background: linear-gradient(to top, #070711, transparent); } .tower { position: absolute; bottom: 0; width: 75px; height: 170px; background: #11101d; } .tower:before { content: ""; position: absolute; top: -48px; left: -12px; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 50px solid #151322; } .t1 { left: 8%; } .t2 { left: 25%; height: 140px; } .t3 { right: 25%; height: 155px; } .t4 { right: 8%; } /* Main */ .main { position: relative; z-index: 5; min-height: 100vh; display: flex; justify-content: center; align-items: center; } /* Prince */ .prince { position: relative; width: 250px; height: 390px; display: flex; align-items: center; flex-direction: column; filter: drop-shadow(0 0 25px rgba(255,180,220,.4)); } /* Crown */ .crown { position: absolute; top: -38px; font-size: 48px; z-index: 10; } /* Head */ .head { position: relative; width: 90px; height: 105px; margin-top: 35px; border-radius: 48% 48% 45% 45%; background: linear-gradient(135deg, #f4c5a6, #c98567); z-index: 4; } /* Hair */ .hair { position: absolute; top: -12px; width: 105px; height: 58px; border-radius: 55% 55% 25% 25%; background: linear-gradient(135deg, #2c1915, #080606); } .hair:before, .hair:after { content: ""; position: absolute; top: 25px; width: 25px; height: 55px; background: #110b0a; } .hair:before { left: 0; border-radius: 10px 0 15px 20px; } .hair:after { right: 0; border-radius: 0 10px 20px 15px; } /* Eyes */ .eye { position: absolute; top: 43px; width: 10px; height: 6px; border-radius: 50%; background: #211518; } .eye.left { left: 24px; } .eye.right { right: 24px; } /* Nose */ .nose { position: absolute; top: 51px; left: 42px; width: 7px; height: 17px; border-right: 2px solid rgba(80,40,30,.5); } /* Smile */ .smile { position: absolute; top: 76px; left: 33px; width: 25px; height: 10px; border-bottom: 2px solid #762f3a; border-radius: 50%; } /* Body */ .body { position: relative; width: 155px; height: 195px; background: linear-gradient(90deg, #171a35, #45335e, #17172e); border-radius: 45px 45px 12px 12px; } /* Collar */ .collar { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 65px; height: 70px; background: linear-gradient(135deg, #f5e1a4, #b8892f); clip-path: polygon(0 0, 50% 75%, 100% 0, 82% 100%, 18% 100%); } /* Buttons */ .button { position: absolute; left: 50%; transform: translateX(-50%); width: 9px; height: 9px; border-radius: 50%; background: #f4d477; box-shadow: 0 0 8px #f4d477; } .b1 { top: 85px; } .b2 { top: 110px; } .b3 { top: 135px; } /* Cape */ .cape { position: absolute; top: 55px; width: 210px; height: 230px; background: linear-gradient(135deg, #510d30, #160713); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); z-index: -1; } /* HEART ORBIT */ .orbit { position: absolute; top: 5px; width: 390px; height: 390px; border: 2px solid rgba(255,130,190,.25); border-radius: 50%; animation: rotate 7s linear infinite; } .heart { position: absolute; font-size: 38px; filter: drop-shadow(0 0 8px #ff3d86) drop-shadow(0 0 20px #ff3d86); } .h1 { top: -22px; left: 175px; } .h2 { right: -18px; top: 175px; } .h3 { bottom: -22px; left: 175px; } .h4 { left: -18px; top: 175px; } @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } } /* Bottom area */ .content { position: fixed; bottom: 25px; left: 0; width: 100%; z-index: 30; } .content h1 { font-size: 35px; letter-spacing: 3px; text-shadow: 0 0 15px #ff6fa8, 0 0 30px #ff2d7d; } .content p { margin-top: 5px; color: #ffd9e9; } /* Buttons */ .buttons { margin-top: 15px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; } .buttons button { border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.15); color: white; padding: 10px 14px; border-radius: 25px; font-family: Georgia, serif; cursor: pointer; backdrop-filter: blur(8px); box-shadow: 0 0 12px rgba(255,70,140,.25); transition: .3s; } .buttons button:hover { transform: scale(1.08); background: rgba(255,80,150,.35); } /* Message box */ .message { display: none; position: fixed; z-index: 100; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 380px; padding: 30px 20px; border-radius: 25px; background: rgba(30, 10, 30, .92); border: 1px solid #ff8fbd; box-shadow: 0 0 25px #ff4d91, 0 0 70px rgba(255,50,130,.4); } .message h2 { color: #ffb5d3; margin-bottom: 12px; } .message p { line-height: 1.7; color: #fff0f6; } .close { margin-top: 18px; padding: 9px 20px; border: none; border-radius: 20px; background: #ff4f91; color: white; cursor: pointer; } /* Floating hearts */ .floating { position: fixed; bottom: -30px; font-size: 22px; animation: float 6s linear forwards; z-index: 15; } @keyframes float { 0% { transform: translateY(0) scale(.7); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-110vh) scale(1.4); opacity: 0; } } /* Mobile */ @media(max-width:600px) { .prince { transform: scale(.75); } .content h1 { font-size: 28px; } .content { bottom: 15px; } .buttons button { padding: 8px 11px; font-size: 12px; } .moon { width: 60px; height: 60px; } } </style> </head> <body> <div class="stars"></div> <div class="moon"></div> <div class="castle"> <div class="tower t1"></div> <div class="tower t2"></div> <div class="tower t3"></div> <div class="tower t4"></div> </div> <div class="main"> <div class="prince"> <!-- HEARTS AROUND PRINCE --> <div class="orbit"> <div class="heart h1">❤️</div> <div class="heart h2">💖</div> <div class="heart h3">❤️</div> <div class="heart h4">💗</div> </div> <div class="crown">👑</div> <div class="head"> <div class="hair"></div> <div class="eye left"></div> <div class="eye right"></div> <div class="nose"></div> <div class="smile"></div> </div> <div class="body"> <div class="collar"></div> <div class="button b1"></div> <div class="button b2"></div> <div class="button b3"></div> </div> <div class="cape"></div> </div> </div> <div class="content"> <h1>Sudu Manika ❤️</h1> <p>A little magical world made just for you ✨</p> <div class="buttons"> <button onclick="showMessage( '💌 A Little Message', 'Sudu Manika, you are a beautiful part of my little world. Every moment with you is special to me. ❤️' )"> 💌 Message </button> <button onclick="showMessage( '❤️ From My Heart', 'No matter how many stars shine in the sky, you will always be the brightest one in my heart. ✨❤️' )"> ❤️ My Heart </button> <button onclick="showMessage( '👑 My Sudu Manika', 'If this were a fairy tale, I would choose you as my forever special person. 👑💕' )"> 👑 For You </button> </div> </div> <!-- Message Popup --> <div class="message" id="messageBox"> <h2 id="messageTitle"></h2> <p id="messageText"></p> <button class="close" onclick="closeMessage()"> Close ❤️ </button> </div> <script> function showMessage(title, text) { document.getElementById("messageTitle").innerHTML = title; document.getElementById("messageText").innerHTML = text; document.getElementById("messageBox").style.display = "block"; } function closeMessage() { document.getElementById("messageBox").style.display = "none"; } /* Floating hearts */ function createHeart() { const heart = document.createElement("div"); heart.className = "floating"; const list = ["❤️", "💖", "💕", "💗", "💘"]; heart.innerHTML = list[Math.floor(Math.random() * list.length)]; heart.style.left = Math.random() * 100 + "vw"; heart.style.animationDuration = (4 + Math.random() * 4) + "s"; document.body.appendChild(heart); setTimeout(() => { heart.remove(); }, 8000); } setInterval(createHeart, 500); </script> </body> </html>
